version: 1
schemas:
  - id: pre-lineup
    description: Has none of the four lineup markers (lineup_data/, prod_refy_estimation.fst, lineup_years.fst, lineup_dist_stats.fst).
    checks:
      - type: dir_exists
        path: lineup_data
        present: false
      - type: file_exists
        path: estimations/prod_refy_estimation.fst
        present: false
      - type: file_exists
        path: estimations/lineup_years.fst
        present: false
      - type: file_exists
        path: estimations/lineup_dist_stats.fst
        present: false
  - id: new-lineup
    description: Has lineup_data/ (non-empty, .fst only) and the three lineup estimation files (prod_refy_estimation.fst, lineup_years.fst, lineup_dist_stats.fst).
    checks:
      - type: dir_exists
        path: lineup_data
        present: true
      - type: dir_extension
        path: lineup_data
        extension: .fst
      - type: file_exists
        path: estimations/prod_refy_estimation.fst
        present: true
      - type: file_exists
        path: estimations/lineup_years.fst
        present: true
      - type: file_exists
        path: estimations/lineup_dist_stats.fst
        present: true
